server:
  port: 8100

spring:
  application:
    name: mcp-client

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b
        options:
          temperature: 0.7
          num-predict: 1024

    mcp:
      client:
        enabled: true
        initialized: true
        type: SYNC
        request-timeout: 30s
        toolcallback:
          enabled: true
        sse:
          connections:
            product-server:
              url: http://localhost:8081
              sse-endpoint: /sse

logging:
  level:
    com.voice_ai_app.mcp_client: DEBUG
    org.springframework.ai: DEBUG
    io.modelcontextprotocol: DEBUG
